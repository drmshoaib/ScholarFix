<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ScholarFix client journey</title>
  <desc id="desc">A top-to-bottom view of how a manuscript moves from upload to review signals, rewrite support, and exportable deliverables.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <rect x="34" y="34" width="1132" height="652" rx="24" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="82" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">ScholarFix Client Journey</text>
  <text x="82" y="124" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">From manuscript upload to actionable feedback, clean rewrite drafts, and downloadable review packs.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="174" width="260" height="124" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="120" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">1. Submit manuscript</text>
    <text x="120" y="246" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#7c2d12">PDF, DOCX, or LaTeX upload</text>
    <text x="120" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#7c2d12">with local extraction preview.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="174" width="260" height="124" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="500" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">2. Inspect signals</text>
    <text x="500" y="246" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#1e3a8a">Readability, math notation,</text>
    <text x="500" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#1e3a8a">and citation pattern checks.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="174" width="260" height="124" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="880" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#15803d">3. Improve prose</text>
    <text x="880" y="246" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#166534">Tone, section, and level-aware</text>
    <text x="880" y="270" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#166534">AI rewrite support.</text>
  </g>

  <path d="M350 236 H450" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M730 236 H830" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="172" y="392" width="856" height="170" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="220" y="440" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Client-ready outputs</text>
    <text x="220" y="476" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Feedback report, Markdown notes, highlighted diff, clean rewrite PDF, and reviewer-style summary.</text>
    <rect x="220" y="510" width="148" height="34" rx="17" fill="#e0f2fe"/>
    <text x="245" y="532" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#075985">TXT report</text>
    <rect x="390" y="510" width="168" height="34" rx="17" fill="#dcfce7"/>
    <text x="418" y="532" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">Markdown pack</text>
    <rect x="580" y="510" width="150" height="34" rx="17" fill="#fee2e2"/>
    <text x="620" y="532" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">PDF export</text>
    <rect x="752" y="510" width="190" height="34" rx="17" fill="#fef3c7"/>
    <text x="778" y="532" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Rewrite draft</text>
  </g>

  <path d="M600 298 V376" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="82" y="642" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">Positioning: an academic writing support workflow, not an automated referee or scholarly correctness guarantee.</text>
</svg>
