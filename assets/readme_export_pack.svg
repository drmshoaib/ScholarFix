<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ScholarFix export pack</title>
  <desc id="desc">A summary of the exportable client deliverables generated by ScholarFix.</desc>
  <rect width="1200" height="560" rx="28" fill="#fffdf7"/>
  <rect x="46" y="46" width="1108" height="468" rx="24" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="86" y="108" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">Client Deliverable Pack</text>
  <text x="86" y="144" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#57534e">ScholarFix turns a manuscript review session into reusable notes, drafts, and reports.</text>

  <rect x="92" y="205" width="236" height="190" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="126" y="254" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#1d4ed8">TXT</text>
  <text x="126" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Plain feedback report</text>
  <text x="126" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Fast to read, copy,</text>
  <text x="126" y="346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">and share internally.</text>

  <rect x="358" y="205" width="236" height="190" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="392" y="254" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#15803d">MD</text>
  <text x="392" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Structured review notes</text>
  <text x="392" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Useful for issue trackers,</text>
  <text x="392" y="346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">drafting logs, and GitHub.</text>

  <rect x="624" y="205" width="236" height="190" rx="18" fill="#fef2f2" stroke="#fecaca"/>
  <text x="658" y="254" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#b91c1c">PDF</text>
  <text x="658" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Branded feedback pack</text>
  <text x="658" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Portable summary for</text>
  <text x="658" y="346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">authors and supervisors.</text>

  <rect x="890" y="205" width="236" height="190" rx="18" fill="#fefce8" stroke="#fde68a"/>
  <text x="924" y="254" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#a16207">DRAFT</text>
  <text x="924" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Clean rewritten PDF</text>
  <text x="924" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">A readable candidate</text>
  <text x="924" y="346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">draft for author review.</text>

  <rect x="86" y="440" width="1028" height="38" rx="19" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="120" y="465" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Trust boundary: outputs are reviewer-style support material and must be checked by the author before submission.</text>
</svg>
