<!DOCTYPE html>
<html>
  <head>
    <title>ScholarFix Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.js"></script>
    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.2/firebase-ui-auth.css" />
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <h2>Sign in to use ScholarFix</h2>
    <div id="firebaseui-auth-container"></div>

    <script>
      const firebaseConfig = {
        apiKey: "YOUR_FIREBASE_WEB_API_KEY",
        authDomain: "YOUR_FIREBASE_PROJECT.firebaseapp.com",
        projectId: "YOUR_FIREBASE_PROJECT",
        storageBucket: "YOUR_FIREBASE_PROJECT.appspot.com",
        messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
        appId: "YOUR_FIREBASE_APP_ID",
        measurementId: "YOUR_FIREBASE_MEASUREMENT_ID"
      };

      if (firebaseConfig.apiKey.startsWith("YOUR_")) {
        document.body.insertAdjacentHTML(
          "beforeend",
          "<p>Firebase web configuration is not set. Use REDPEN_DEV_MODE=true for local development or update this component before deployment.</p>"
        );
      }

      firebase.initializeApp(firebaseConfig);

      const uiConfig = {
        signInSuccessUrl: window.location.href,
        signInOptions: [
          firebase.auth.GoogleAuthProvider.PROVIDER_ID,
          firebase.auth.EmailAuthProvider.PROVIDER_ID
        ],
        credentialHelper: firebaseui.auth.CredentialHelper.NONE,
        callbacks: {
          signInSuccessWithAuthResult: function(authResult, redirectUrl) {
            authResult.user.getIdToken().then((token) => {
              window.parent.postMessage({ token }, "*");
            });
            return false; // Prevent redirect
          }
        }
      };

      const ui = new firebaseui.auth.AuthUI(firebase.auth());
      ui.start("#firebaseui-auth-container", uiConfig);
    </script>
  </body>
</html>
